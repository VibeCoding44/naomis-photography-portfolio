# ---------------------------------------------------------------------------
# Decap CMS configuration — the photo-upload portal at /admin
# ---------------------------------------------------------------------------

# --- AUTH / GIT BACKEND ----------------------------------------------------
# Photographers log in here via DecapBridge (PKCE auth). Netlify Identity is
# deprecated (Feb 2025), so DecapBridge handles login + commits uploads to
# this repo. Values below were generated by DecapBridge for this site.
backend:
  name: git-gateway
  repo: VibeCoding44/naomis-photography-portfolio
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/226e0b21-55e8-49cb-88e6-8b2de5c72940/pkce
  auth_token_endpoint: /sites/226e0b21-55e8-49cb-88e6-8b2de5c72940/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what in the git history
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# DecapBridge PKCE identity claims
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Branding + site link shown inside the CMS
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://cutecompanyphotography.com

# --- APPROVAL-FIRST --------------------------------------------------------
# Every upload becomes a Draft → Pending (a pull request) and only appears on
# the live portfolio after YOU click "Publish" in this dashboard.
publish_mode: editorial_workflow

# Friendlier mobile/desktop UX
locale: en
show_preview_links: false

# --- PHOTO STORAGE: Cloudinary --------------------------------------------
# Uploaded photos go to Cloudinary's image CDN (auto-resized, fast), NOT into
# the git repo — so the repo stays small. Only a tiny JSON file per photo is
# committed. cloud_name + api_key are PUBLIC by design (safe to commit).
# ⚠️  REPLACE with your Cloudinary cloud name + API key.
media_library:
  name: cloudinary
  config:
    cloud_name: dqvxyv8cp        # public by design — safe to commit
    api_key: "182326936831169"   # public by design — safe to commit

# Local fallback folder (used only if Cloudinary is ever removed)
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# --- WHAT PHOTOGRAPHERS CAN EDIT -------------------------------------------
collections:
  - name: portfolio
    label: Portfolio Photos
    label_singular: Photo
    description: "Upload a photo, add an optional caption, then submit for approval."
    folder: content/portfolio
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: caption
    summary: "{{caption}} — {{category}}"
    sortable_fields: [order, date]
    fields:
      - { name: image, label: Photo, widget: image }
      - { name: caption, label: Caption (optional), widget: string, required: false }
      - name: category
        label: Category
        widget: select
        default: portraits
        options:
          - { label: Portraits, value: portraits }
          - { label: Weddings, value: weddings }
          - { label: Commercial, value: commercial }
          - { label: Events, value: events }
      - { name: order, label: "Sort order (lower shows first)", widget: number, value_type: int, default: 100, required: false }
      - { name: date, label: "Date taken (optional)", widget: datetime, required: false, default: "" }
