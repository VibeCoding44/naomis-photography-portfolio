# ---------------------------------------------------------------------------
# Decap CMS configuration — the photo-upload portal at /admin
# ---------------------------------------------------------------------------

# --- AUTH / GIT BACKEND ----------------------------------------------------
# Photographers log in here via DecapBridge (PKCE auth). Netlify Identity is
# deprecated (Feb 2025), so DecapBridge handles login + commits uploads to
# this repo. Values below were generated by DecapBridge for this site.
backend:
  name: git-gateway
  repo: VibeCoding44/naomis-photography-portfolio
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/226e0b21-55e8-49cb-88e6-8b2de5c72940/pkce
  auth_token_endpoint: /sites/226e0b21-55e8-49cb-88e6-8b2de5c72940/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what in the git history
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# DecapBridge PKCE identity claims
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Branding + site link shown inside the CMS
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://cutecompanyphotography.com

# --- APPROVAL-FIRST --------------------------------------------------------
# Every upload becomes a Draft → Pending (a pull request) and only appears on
# the live portfolio after YOU click "Publish" in this dashboard.
publish_mode: editorial_workflow

# Friendlier mobile/desktop UX
locale: en
show_preview_links: false

# --- PHOTO STORAGE: repo-backed -------------------------------------------
# Photographers upload right inside the portal using only their DecapBridge
# login (no Cloudinary account needed). The image file is committed to this
# repo under public/images/uploads/ and served from /images/uploads/.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# --- WHAT PHOTOGRAPHERS CAN EDIT -------------------------------------------
collections:
  - name: portfolio
    label: Portfolio Photos
    label_singular: Photo
    description: "Upload a photo, add an optional caption, then submit for approval."
    folder: content/portfolio
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: [order, date]
    fields:
      - { name: image, label: Photo, widget: image, hint: "One photo per entry — to add several photos, save a separate entry for each. Big phone photos are fine; they're compressed automatically after publish." }
      - { name: title, label: "Caption / title for this photo", widget: string }
      - name: category
        label: Category
        widget: select
        default: portraits
        options:
          - { label: Portraits, value: portraits }
          - { label: Engagements, value: engagements }
          - { label: Weddings, value: weddings }
          - { label: Commercial, value: commercial }
          - { label: Events, value: events }
      - { name: order, label: "Sort order (lower shows first)", widget: number, value_type: int, default: 100, required: false }
      - { name: date, label: "Date taken (optional)", widget: datetime, required: false, default: "" }

  - name: sessions
    label: Sessions & Stories
    label_singular: Story
    description: "Write a short story about a real wedding, engagement, or portrait session — or a quick Story post built around one favorite photo. Add the venue/location in the title for SEO (e.g. 'Engagement Session at Edward Medard Park')."
    folder: content/sessions
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Title", widget: string, hint: "Put the venue or city in the title — it's how couples find you on Google. e.g. 'Engagement Session at Edward Medard Park, Plant City'." }
      - name: type
        label: "Post type"
        widget: select
        default: session
        required: false
        hint: "Session recap = a full shoot with a gallery. Story = a quick post about one favorite photo or moment — the gallery below is optional for those."
        options:
          - { label: "Session recap (full shoot)", value: session }
          - { label: "Story (one photo or moment)", value: story }
      - { name: date, label: "Date of the session", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: location, label: "Location / city", widget: string, required: false, hint: "e.g. Plant City, FL  ·  Tampa, FL  ·  Lakeland, FL" }
      - { name: venue, label: "Venue name (optional)", widget: string, required: false, hint: "The park, barn, church, or venue — leave blank if it was a roaming session." }
      - name: category
        label: Category
        widget: select
        default: weddings
        options:
          - { label: Weddings, value: weddings }
          - { label: Engagements, value: engagements }
          - { label: Portraits, value: portraits }
          - { label: Family, value: family }
          - { label: Commercial, value: commercial }
          - { label: Events, value: events }
      - { name: excerpt, label: "Short summary", widget: text, hint: "1–2 warm sentences. This shows on the Sessions page, in Google results, and on Pinterest — make it inviting, not technical." }
      - { name: coverImage, label: "Cover photo", widget: image, hint: "Your strongest image — it's the first thing people see and what shows when the post is shared." }
      - { name: galleryUrl, label: "Full gallery link (Pic-Time)", widget: string, required: false, pattern: ['^https?://.+', "Paste the full Pic-Time gallery link, starting with https://"], hint: "Paste the Pic-Time gallery URL to add a 'View the full gallery' button. Use the clean link that ends in /gallery — drop anything after a '?'." }
      - name: gallery
        label: "Photo gallery (optional)"
        widget: list
        required: false
        summary: "{{fields.alt}}"
        label_singular: "Photo"
        hint: "Add a handful of favorites from the session. A short description on each helps Google Images find them."
        fields:
          - { name: image, label: Photo, widget: image }
          - { name: alt, label: "Describe the photo", widget: string, required: false, hint: "e.g. 'Bride laughing during first look at golden hour'." }
      - name: body
        label: "The story"
        widget: markdown
        hint: "Replace the italic prompts below with your own words. Keep the headings and the last paragraph (those links help you show up on Google). 4–6 short paragraphs is plenty — write like you're telling a friend."
        default: |
          *Open with one or two sentences that set the scene — the place, the light, and how the day felt.*

          ## The Day

          *Who were you photographing, and what was happening? A wedding, an engagement, a family session? What were they like together?*

          ## A Moment We Loved

          *Pick one small moment that stuck with you and describe it in a sentence or two.*

          ## Planning Your Own Session

          Dreaming up your own session in Plant City or Tampa Bay? Browse our [portfolio](/portfolio), explore our [services & packages](/services), and [get in touch](/contact) to check your date.

  # --- OFFERS / PROMOS: one evergreen page, edited in place -----------------
  # Time-limited promos live on /offers (and on GBP/Instagram/email — those
  # channels are instant; this page is the on-site home for them). Editing this
  # single page beats dated promo posts: it stays indexed while the offers
  # inside it change.
  - name: offers
    label: Offers & Promos
    files:
      - file: content/offers/offers.json
        name: offers
        label: "Current Offers page"
        description: "The /offers page. Add a promo when you're running one; delete it when it ends. The page reads fine with no offers listed."
        fields:
          - { name: heading, label: "Page heading", widget: string, default: "Current Offers & Mini Sessions" }
          - { name: intro, label: "Intro paragraph", widget: text, hint: "1–3 sentences welcoming people to the page. Shown under the heading." }
          - name: items
            label: "Active offers"
            widget: list
            required: false
            summary: "{{fields.title}}"
            label_singular: "Offer"
            hint: "One entry per promo — e.g. 'Fall Mini Sessions', 'Graduation Special'. Remove it here when the promo ends."
            fields:
              - { name: title, label: "Offer name", widget: string, hint: "e.g. 'Fall Mini Sessions at Bonnet Springs Park'." }
              - { name: description, label: "Details", widget: text, hint: "What's included, how long, where — 2–4 sentences." }
              - { name: image, label: "Photo (optional)", widget: image, required: false }
              - { name: price, label: "Price line (optional)", widget: string, required: false, hint: "Free text — e.g. '$250 · 20 minutes · 15 edited images'." }
              - { name: validUntil, label: "Book by / runs until (optional)", widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "The offer hides from the page automatically after this date (on the next site update)." }
