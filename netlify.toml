[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Force the default Netlify subdomain to the canonical custom domain. Netlify's
# primary-domain auto-redirect is unreliable, so we make it explicit. Matched on
# host, so requests to cutecompanyphotography.com are unaffected (no loop).
# force = true is required because every path serves a static file, which would
# otherwise shadow the redirect.
[[redirects]]
  from = "https://naomis-photography-portfolio-v1.netlify.app/*"
  to = "https://cutecompanyphotography.com/:splat"
  status = 301
  force = true

# Public site policy (strict). Listed FIRST so the more-specific /admin/*
# rule below is the LAST match for admin paths and wins there.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Scoped policy for the CMS upload portal. Decap CMS loads its bundle from a
# CDN and talks to GitHub / DecapBridge / Cloudinary, so /admin needs a more
# permissive CSP. Declared LAST so it overrides /* for the admin route
# (Netlify applies the last matching headers rule).
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: ws: data: blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
